services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput && python3 manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    user: "1000:1000"

  celery_worker:
    build: .
    command: celery -A Topic worker -Q email.confirm,email.reset -l info
    volumes:
      - .:/app
      - celery_data:/app/celery_data
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    user: "1000:1000"

  celery_beat:
    build: .
    command: celery -A Topic beat --loglevel=info --schedule=/app/celery_data/celerybeat-schedule
    volumes:
      - .:/app
      - celery_data:/app/celery_data
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    user: "1000:1000"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP (для Python)
      - "15672:15672"   # Web UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  redis_data:
  static_volume:
  media_volume:
  celery_data:
  rabbitmq_data:
